name: Release Compiler

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      compatibilityLine: ${{ steps.version.outputs.compatibilityLine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Validate tag against canonical project version
        shell: pwsh
        run: ./build/release/validate-release-version.ps1 -Tag '${{ github.ref_name }}'

  source-validation:
    name: Release source gate
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure clang toolkit for source tests
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            Join-Path $env:ProgramFiles 'LLVM\bin' | Out-File -Append $env:GITHUB_PATH
          }
          clang --version
      - name: Restore
        run: dotnet restore src/Cvolo.slnx --nologo
      - name: Build
        run: dotnet build src/Cvolo.slnx -c Release --no-restore --nologo
      - name: Full tests
        run: dotnet test src/Cvolo.slnx -c Release --no-build --nologo -- RunConfiguration.TestSessionTimeout=1800000

  publish:
    name: Publish + package + smoke ${{ matrix.rid }}
    needs: [validate, source-validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # These are publish-time NativeAOT build prerequisites. During release smoke,
      # Cvolo must select its bundled clang. That clang may still use platform
      # linker/SDK/runtime components supplied by the runner OS.
      - name: Install NativeAOT build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm zlib1g-dev
      - name: Verify NativeAOT build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          clang --version
      - name: Verify NativeAOT build prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: clang --version

      - name: Clean release workspace
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifacts/release-staging -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifacts/release-assets -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifacts/release-smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'artifacts/release-staging/${{ matrix.rid }}' | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifacts/release-assets' | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifacts/release-smoke/${{ matrix.rid }}' | Out-Null

      - name: Publish production compiler
        shell: pwsh
        run: |
          dotnet publish src/Cvolo/Cvolo.csproj `
            -c Release `
            -f net10.0 `
            -r '${{ matrix.rid }}' `
            --self-contained true `
            --nologo `
            -p:PublishAot=true `
            -p:PublishSingleFile=true `
            -o 'artifacts/release-staging/${{ matrix.rid }}'

      - name: Create manifest and final archive
        shell: pwsh
        run: |
          ./build/release/pack-compiler-release.ps1 `
            -StageDir 'artifacts/release-staging/${{ matrix.rid }}' `
            -OutDir 'artifacts/release-assets' `
            -Version '${{ needs.validate.outputs.version }}' `
            -Rid '${{ matrix.rid }}' `
            -SourceRevision '${{ github.sha }}' `
            -CompilerCompatibilityLine '${{ needs.validate.outputs.compatibilityLine }}' `
            -TargetFramework 'net10.0'

      - name: Extract exact final archive into clean smoke directory
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $rid = '${{ matrix.rid }}'
          $destination = "artifacts/release-smoke/$rid"
          if ($rid -eq 'win-x64') {
            $archive = "artifacts/release-assets/cvolo-compiler-$version-$rid.zip"
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
          }
          else {
            $archive = "artifacts/release-assets/cvolo-compiler-$version-$rid.tar.gz"
            tar -xzf $archive -C $destination
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract $archive" }
          }

      - name: Smoke exact extracted release payload
        shell: pwsh
        run: |
          ./build/release/smoke-compiler.ps1 `
            -PayloadDir 'artifacts/release-smoke/${{ matrix.rid }}' `
            -ExpectedVersion '${{ needs.validate.outputs.version }}' `
            -Rid '${{ matrix.rid }}'

      - name: Upload RID release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, source-validation, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true

      - name: Validate complete asset set and generate SHA256SUMS
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $revision = '${{ github.sha }}'
          $rids = @('win-x64','linux-x64','linux-arm64','osx-arm64')
          $archives = @()

          foreach ($rid in $rids) {
            $archiveName = if ($rid -eq 'win-x64') { "cvolo-compiler-$version-$rid.zip" } else { "cvolo-compiler-$version-$rid.tar.gz" }
            $archivePath = Join-Path artifacts/release $archiveName
            $manifestPath = Join-Path artifacts/release "cvolo-compiler-$version-$rid.manifest.json"

            if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) { throw "Missing $archiveName" }
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw "Missing manifest for $rid" }

            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.schemaVersion -ne 1) { throw "Unexpected manifest schema for $rid" }
            if ($manifest.compilerVersion -cne $version) { throw "Manifest compilerVersion mismatch for $rid" }
            if ($manifest.sourceRevision -cne $revision) { throw "Manifest sourceRevision mismatch for $rid" }
            if ($manifest.targetFramework -cne 'net10.0') { throw "Manifest targetFramework mismatch for $rid" }
            if ($manifest.rid -cne $rid) { throw "Manifest RID mismatch for $rid" }
            if ($manifest.publishMode -cne 'native-aot-single-file') { throw "Manifest publishMode mismatch for $rid" }
            if ($manifest.compilerCompatibilityLine -cne '${{ needs.validate.outputs.compatibilityLine }}') { throw "Manifest compilerCompatibilityLine mismatch for $rid" }
            $expectedEntrypoint = if ($rid -eq 'win-x64') { 'Cvolo.exe' } else { 'Cvolo' }
            if ($manifest.entrypoint -cne $expectedEntrypoint) { throw "Manifest entrypoint mismatch for $rid: expected '$expectedEntrypoint', got '$($manifest.entrypoint)'" }
            if ($null -eq $manifest.files -or @($manifest.files).Count -eq 0) { throw "Manifest files list is empty for $rid" }

            $archives += Get-Item -LiteralPath $archivePath
          }

          $lines = foreach ($archive in ($archives | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($archive.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path artifacts/release).Path 'SHA256SUMS'),
            $lines,
            [Text.UTF8Encoding]::new($false))

      - name: Create release as draft, upload complete set, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ needs.validate.outputs.version }}'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release '$tag' already exists; refusing to overwrite it."
          }

          $created = $false
          try {
            gh release create $tag --verify-tag --draft --title "Cvolo compiler $version" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release.' }
            $created = $true

            $assets = Get-ChildItem -LiteralPath artifacts/release -File | Sort-Object Name | ForEach-Object FullName
            gh release upload $tag @assets
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload complete release asset set.' }

            if ('${{ needs.validate.outputs.prerelease }}' -eq 'true') {
              gh release edit $tag --draft=false --prerelease
            }
            else {
              gh release edit $tag --draft=false
            }
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish GitHub Release.' }
            $created = $false
          }
          finally {
            if ($created) {
              gh release delete $tag --yes 2>$null
            }
          }
