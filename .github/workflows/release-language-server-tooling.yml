name: Release Language Server Tooling

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to create or update.
        required: true
        default: v0.0.5-alpha.1

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore src/Cvolo.slnx

      - name: Build tooling tests and artifact
        shell: pwsh
        run: dotnet build src/Cvolo.Tests.Tooling/Cvolo.Tests.Tooling.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test tooling artifact contract
        shell: pwsh
        run: dotnet test src/Cvolo.Tests.Tooling/Cvolo.Tests.Tooling.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true

      - name: Read tooling version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath src/Directory.Build.props
          $versionNode = $props.SelectSingleNode('/Project/PropertyGroup/ToolingVersion')
          $version = $versionNode.InnerText
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'ToolingVersion not found in src/Directory.Build.props.' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName'
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tag)) {
              throw 'No release_tag was provided and no existing GitHub release was found.'
            }
            Write-Host "Using latest release tag $tag."
          }

          if (-not $tag.StartsWith('v')) {
            throw "release_tag must start with 'v'. Got '$tag'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Package managed tooling asset
        shell: pwsh
        run: |
          ./build/release/pack-language-server-tooling.ps1 `
            -ArtifactDir "artifacts/tooling/${{ steps.version.outputs.value }}" `
            -Version "${{ steps.version.outputs.value }}" `
            -OutputDir "artifacts/release"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }

          Write-Host "Creating prerelease $tag at $env:GITHUB_SHA."
          gh release create $tag `
            --target $env:GITHUB_SHA `
            --title $tag `
            --notes "Managed language server tooling ${{ steps.version.outputs.value }}." `
            --prerelease

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" artifacts/release/* --clobber
