name: Release Language Server Tooling

on:
  push:
    tags:
      - 'tooling-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      compatibilityLine: ${{ steps.validate.outputs.compatibilityLine }}
      compilerVersion: ${{ steps.validate.outputs.compilerVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tooling release tag
        id: validate
        shell: pwsh
        run: ./build/release/validate-tooling-version.ps1 -Tag '${{ github.ref_name }}'

  build-and-package:
    needs: validate
    runs-on: windows-latest
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore src/Cvolo.slnx

      - name: Build tooling artifact and boundary tests
        shell: pwsh
        run: >
          dotnet build src/Cvolo.Tests.Tooling/Cvolo.Tests.Tooling.csproj
          -c Release --no-restore -p:ContinuousIntegrationBuild=true
          -p:ToolingCommit=${{ github.sha }}

      - name: Run tooling boundary and artifact contract tests
        shell: pwsh
        run: >
          dotnet test src/Cvolo.Tests.Tooling/Cvolo.Tests.Tooling.csproj
          -c Release --no-build -p:ContinuousIntegrationBuild=true
          -- RunConfiguration.TestSessionTimeout=1800000

      - name: Package RID-neutral managed tooling asset
        shell: pwsh
        run: >
          ./build/release/pack-language-server-tooling.ps1
          -ArtifactDir "artifacts/tooling/${{ needs.validate.outputs.version }}"
          -Version "${{ needs.validate.outputs.version }}"
          -OutputDir "artifacts/release"

      - name: Smoke final tooling bundle
        shell: pwsh
        run: >
          ./build/release/smoke-tooling-bundle.ps1
          -ArchivePath "artifacts/release/CvoloLanguageServerTooling-${{ needs.validate.outputs.version }}.zip"
          -ExpectedVersion "${{ needs.validate.outputs.version }}"
          -TestProject "src/Cvolo.Tests.Tooling/Cvolo.Tests.Tooling.csproj"
          -Configuration Release
          -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Upload verified tooling release asset
        uses: actions/upload-artifact@v4
        with:
          name: tooling-release-asset
          path: artifacts/release/**
          if-no-files-found: error

  release:
    needs: [validate, build-and-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tooling-release-asset
          path: artifacts/release

      - name: Validate complete tooling asset set
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $expected = @(
            "CvoloLanguageServerTooling-$version.zip",
            "CvoloLanguageServerTooling-$version.zip.sha256"
          )
          $actual = @(Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object { $_.Name })

          foreach ($name in $expected) {
            if ($actual -notcontains $name) {
              throw "Missing Tooling release asset: $name"
            }
          }

          if ($actual.Count -ne $expected.Count) {
            throw "Unexpected Tooling release assets: $($actual -join ', ')"
          }

      - name: Create tooling release as draft, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ needs.validate.outputs.version }}'
          $compatibilityLine = '${{ needs.validate.outputs.compatibilityLine }}'
          $compilerVersion = '${{ needs.validate.outputs.compilerVersion }}'
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'tooling-release-notes.md'

          @'
          `Cvolo Compiler Tooling` is the managed tooling layer used by the Cvolo Language Server and editor integrations.

          It exposes compiler-backed features such as diagnostics, project/document snapshots, semantic queries, and code completion without forcing editors to depend directly on compiler internals.

          > This is **not** a compiler/runtime release.
          >
          > If you only want to build and run Cvolo programs, use the regular Cvolo release.

          ## Why Tooling exists

          Editor features need the same language semantics as the compiler: scope lookup, visibility, member resolution, extension methods, types, and completion ranges.

          Tooling provides a small supported boundary around the compiler so the Language Server can reuse those rules instead of reimplementing them.

          ```text
          Editor / IDE
              ↓
          Cvolo Language Server
              ↓
          Cvolo Compiler Tooling
              ↓
          Cvolo Compiler
          ```

          ## Versioning

          Tooling is versioned independently so editor/tooling fixes can be released without publishing a new compiler build.

          * Tooling: `{0}`
          * Compiler compatibility line: `{1}`
          * Built from compiler: `{2}`
          * Tag: `{3}`

          Tooling revisions such as `{1}.1`, `{1}.2`, etc. are tooling revisions for the same compiler compatibility line, not new compiler versions.

          ## Assets

          * `CvoloLanguageServerTooling-{0}.zip` - verified tooling bundle
          * `CvoloLanguageServerTooling-{0}.zip.sha256` - SHA-256 checksum

          The release pipeline builds, tests, packages, and smoke-tests the bundle before publication.
          '@ -f $version, $compatibilityLine, $compilerVersion, $tag -replace '(?m)^          ', '' | Set-Content -LiteralPath $releaseNotesPath -NoNewline -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release '$tag' already exists; refusing to overwrite a published Tooling release."
          }

          $created = $false
          try {
            gh release create $tag --verify-tag --draft --title "Tooling $version" --notes-file $releaseNotesPath
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft Tooling release.' }
            $created = $true

            $assets = Get-ChildItem -LiteralPath artifacts/release -File | Sort-Object Name | ForEach-Object FullName
            gh release upload $tag @assets
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload complete Tooling release asset set.' }

            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish Tooling GitHub Release.' }
            $created = $false
          }
          finally {
            if ($created) {
              gh release delete $tag --yes 2>$null
            }
          }
